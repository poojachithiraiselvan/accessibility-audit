
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive admin dashboard demo">
    <title>Responsive Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Responsive Admin Dashboard</h1>
        <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
    </header>

    <main class="dashboard">

        <section class="welcome">
            <h2>Dashboard Overview</h2>
            <p>Monitor your dashboard activities and performance.</p>
        </section>

        <section class="stats">

            <article class="card">
                <h3>Total Users</h3>
                <p>120</p>
            </article>

            <article class="card">
                <h3>Active Projects</h3>
                <p>08</p>
            </article>

            <article class="card">
                <h3>Pending Tasks</h3>
                <p>04</p>
            </article>

            <article class="card">
                <h3>Reports</h3>
                <p>15</p>
            </article>

        </section>

        <section class="activity">
            <h2>Recent Activity</h2>
            <p>Stay updated with the latest dashboard activities.</p>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Responsive Admin Dashboard</p>
    </footer>

    <script>
        const toggle = document.getElementById("themeToggle");

        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-theme");
        });
    </script>

</body>
</html>
