
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accessible employee form modal">
    <title>Add New Employee</title>
</head>
<body>

    <main>
        <h1>Employee Management</h1>

        <dialog id="employeeModal" aria-labelledby="modalTitle">
            <h2 id="modalTitle">Add New Employee</h2>

            <form>
                <label for="employeeName">Employee Name</label>
                <input type="text" id="employeeName" name="employeeName" required>

                <label for="employeeEmail">Employee Email</label>
                <input type="email" id="employeeEmail" name="employeeEmail" required>

                <button type="submit">Save Employee</button>

                <button type="button" onclick="document.getElementById('employeeModal').close()">
                    Close
                </button>
            </form>
        </dialog>
    </main>

</body>
</html>
